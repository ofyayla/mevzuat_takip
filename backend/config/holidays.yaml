# Türkiye resmî tatilleri — kaynak sessizliği hesabında iş günü takvimi (İK-7).
# Sabit tatiller her yıl aynıdır ve kodda tanımlıdır (1 Ocak, 23 Nisan, 1 Mayıs, 19 Mayıs, 15 Temmuz, 30 Ağustos,
