# Alembic — veritabanı migrasyonları (İK-8). Bağlantı adresi DATABASE_URL / backend/.env'den okunur.
#   alembic upgrade head                # şemayı güncelle (üretimde ayrı "migrate" servisi çalıştırır)
#   alembic revision --autogenerate -m "açıklama"
[alembic]
script_location = migrations
prepend_sys_path = .
version_path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
