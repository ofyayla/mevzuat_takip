[project]
name = "mevzuat-takip-backend"
version = "0.1.0"
description = "Mevzuat Takip Otomasyonu — backend (kaynak toplama altyapısı)"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "certifi",                 # ek ara sertifikalarla birleşik CA paketi için temel depo
    "cryptography>=42",        # ca-fetch: AIA'dan ara sertifika indirme ve zincir doğrulama
    "trafilatura>=1.12",       # İK-2: HTML ana metin çıkarma
    "pymupdf>=1.24",           # İK-2: PDF metin katmanı ve sayfa sayımı
    "python-docx>=1.1",        # İK-2: DOCX
    "rapidfuzz>=3.6",          # İK-2: tekilleştirme benzerlik skoru
    "openai>=1.40",            # İK-3: OpenAI ve vLLM (OpenAI uyumlu) için tek istemci
    "jinja2>=3.1",             # İK-3: sürümlü prompt şablonları
    "fastapi>=0.110",          # İK-6: Portal API
    "uvicorn[standard]>=0.29",
    "pyjwt[crypto]>=2.8",      # İK-6: Keycloak token'ının çevrimdışı (RS256) doğrulanması
    "python-multipart>=0.0.9", # İK-8: manuel tespit dosyası yükleme
    "openpyxl>=3.1",           # İK-8: Excel (.xlsx) yükleme
    "alembic>=1.13",           # İK-8: veritabanı migrasyonları
    "curl_cffi>=0.7",          # tarayıcı TLS parmak izi taklidi (Resmî Gazete, Ticaret Bakanlığı)
    "selectolax>=0.3.21",
    "feedparser>=6.0",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "pyyaml>=6.0",
    "tenacity>=8.2",
    "sqlalchemy>=2.0",
    "celery[redis]>=5.3",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.1"]
browser = ["playwright>=1.44"]   # yalnızca 'browser' istemcisi seçilen kaynaklar için
dev = ["pytest>=8", "respx>=0.21", "ruff>=0.4"]

[project.scripts]
mevzuat-collect = "app.collectors.cli:main"
mevzuat-process = "app.processing.cli:main"
mevzuat-ai = "app.ai.cli:main"
mevzuat-monitor = "app.monitoring.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: canlı sitelere istek atan testler (varsayılan olarak çalışmaz, -m live ile açılır)"]
addopts = "-m 'not live'"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]   # ruff 0.16 varsayılan kural setini genişletti; eski varsayılan + isort
