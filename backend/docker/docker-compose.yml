# Mevzuat Takip — yerel uçtan uca ortam; kurum topolojisinin küçük kopyası (plan §2.1). Depo kökünden:
#   docker compose -f backend/docker/docker-compose.yml up -d --build
#
#   [DMZ]  crawler ──27017──▶ mongo ◀── [LAN / K8s] api · worker · beat (+ redis, postgres)
#
# Kurum kurulumu bu dosyayla yapılmaz: LAN → deploy/helm (Kubernetes), DMZ → deploy/dmz (podman/compose).
# Şema yalnızca "migrate" tek seferlik servisiyle kurulur/güncellenir (API açılışta migrasyon çalıştırmaz).
x-core: &core
  image: mevzuat-core:latest
  build: {context: ../.., dockerfile: backend/docker/Dockerfile, target: core}
  env_file: [../.env]
  environment: &env
    DATABASE_URL: postgresql+psycopg://mevzuat:${POSTGRES_PASSWORD:-mevzuat}@db:5432/mevzuat
    REDIS_URL: redis://redis:6379/0
    MONGO_URL: mongodb://mongo:27017
    CRAWL_MODE: remote
    RAW_STORAGE: gridfs
    DB_AUTO_CREATE: "false"
    TZ: Europe/Istanbul
  depends_on:
    migrate: {condition: service_completed_successfully}
    mongo: {condition: service_started}
  restart: unless-stopped

services:
  db:
    image: postgres:16
    environment: {POSTGRES_DB: mevzuat, POSTGRES_USER: mevzuat, POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-mevzuat}", TZ: Europe/Istanbul}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck: {test: ["CMD-SHELL", "pg_isready -U mevzuat"], interval: 5s, retries: 20}
    restart: unless-stopped

  redis:                    # yalnızca tetikleyici; kalıcılık kapalı (asıl durum PostgreSQL'de)
    image: redis:7
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    restart: unless-stopped

  mongo:                    # kurumda: 10.155.7.195 (DMZ ↔ LAN teslim alanı)
    image: mongo:7
    volumes: [mongodata:/data/db]
    restart: unless-stopped

  migrate:
    <<: *core
    command: ["alembic", "upgrade", "head"]
    depends_on: {db: {condition: service_healthy}}
    restart: "no"

  api:                      # K8s: mevzuat-takip (portal + /api/v1)
    <<: *core
    ports: ["${API_PORT:-8000}:8000"]

  worker:                   # K8s: mevzuat-takip-worker — başlangıçta tüm kuyruklar tek worker'da
    <<: *core
    command: ["celery", "-A", "app.worker", "worker", "-Q", "ingest,process,ai,monitor,default", "-c", "4",
              "-n", "worker@%h"]
    healthcheck: {disable: true}

  beat:                     # K8s: mevzuat-takip-beat — TEK örnek
    <<: *core
    command: ["celery", "-A", "app.worker", "beat", "--schedule", "/tmp/celerybeat-schedule"]
    healthcheck: {disable: true}

  crawler:                  # DMZ: mevzuat-crawler (internete çıkan tek bileşen)
    image: mevzuat-crawler:latest
    build: {context: ../.., dockerfile: backend/docker/Dockerfile, target: crawler}
    # Geliştirici .env'i verilmez: DMZ'de LLM/OCR/DB ayarı ve anahtarı bulunmaz (bkz. deploy/dmz/crawler.env.example)
    environment:
      MONGO_URL: mongodb://mongo:27017
      TZ: Europe/Istanbul
    volumes: [crawlerdata:/data]
    depends_on: [mongo]
    stop_grace_period: 2m   # süren taramalar bitsin
    restart: unless-stopped

volumes: {pgdata: {}, mongodata: {}, crawlerdata: {}}
