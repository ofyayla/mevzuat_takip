# DMZ crawler — podman-compose / docker compose ile alternatif kurulum (Quadlet tercih edilir):
#   podman-compose -f docker-compose.crawler.yml up -d
services:
  crawler:
    image: 10.54.62.31:9099/com.albaraka.ai/mevzuat-crawler:latest
    env_file: [/etc/mevzuat/crawler.env]
    volumes: [crawlerdata:/data]
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    stop_grace_period: 2m
    hostname: mevzuat-crawler      # sabit ad: kilit/talep sahipliği yeniden başlatmada değişmesin
    mem_limit: 1g                  # sınırsız bellek aşımı sunucuyu OOM'a düşürür (50 MB indirme sınırı × 3 kaynak)
    restart: always
volumes: {crawlerdata: {}}
