# Gizli değerler (chart dışında tutulur; values dosyalarına YAZILMAZ). Kopyalayın → secret.yaml (repoya eklenmez):
#   kubectl -n artint apply -f secret.yaml        # dev için name: mevzuat-takip-dev-secrets, namespace: dev
# Kurumda Vault / External Secrets varsa aynı anahtarlarla oradan üretin.
apiVersion: v1
kind: Secret
metadata:
  name: mevzuat-takip-secrets
  namespace: artint
type: Opaque
stringData:
  DATABASE_URL: postgresql+psycopg://mevzuat:DEGISTIR@POSTGRES_HOST:5432/mevzuat
  # Ana servis Mongo kullanıcısı (deploy/mongo/init-users.js → mevzuat_core)
  MONGO_URL: mongodb://mevzuat_core:DEGISTIR@10.155.7.195:27017/?authSource=admin
  LLM_API_KEY: not-required
  OCR_API_KEY: ""
