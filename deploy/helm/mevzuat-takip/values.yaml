# Ortak değerler. Ortama özgü olanlar values-albaraka-<ortam>.yaml içinde (kurum chart düzeni):
#   helm upgrade --install mevzuat-takip deploy/helm/mevzuat-takip -n <ns> -f deploy/helm/mevzuat-takip/values-albaraka-uat.yaml
# Gizli değerler bu dosyalarda TUTULMAZ → chart dışındaki Secret (deploy/helm/secret.example.yaml).

# core-api (kurum common.deployment şablonu)
deployment:
  name: mevzuat-takip
  autoscaling:
    enabled: false
  replicaCount: 2
  labels:
    app: mevzuat-takip
  podLabels:
    framework: "python"
    app: "mevzuat-takip"
  podAnnotations:
    checksum/config: '{{ toYaml .Values.config | sha256sum }}'   # ConfigMap değişince pod'lar yenilenir
  image:
    registry: "10.54.62.31:9099"
    repository: "com.albaraka.ai/mevzuat-takip-core"
    tag: "latest"
    pullPolicy: Always
  command:   # common şablonu satır içine yazar: tek satırlık dizge olmalı
    key: '["uvicorn", "app.api.main:app", "--host", "0.0.0.0", "--port", "8000", "--proxy-headers", "--forwarded-allow-ips", "*"]'
  containerPort: 8000
  envVarsCM: mevzuat-takip-config
  envVarsSecret: mevzuat-takip-secrets
  readinessProbe:
    httpGet: {path: /readyz, port: http-api}
    periodSeconds: 10
    timeoutSeconds: 5
  livenessProbe:
    httpGet: {path: /healthz, port: http-api}
    periodSeconds: 30
    timeoutSeconds: 5
  resources:
    requests: {cpu: 250m, memory: 512Mi, ephemeral-storage: "1Gi"}
    limits: {cpu: "1", memory: 1Gi, ephemeral-storage: "2Gi"}
  volumes:
    - {name: tmp, emptyDir: {}}
    - {name: data, emptyDir: {}}
  volumeMounts:
    - {name: tmp, mountPath: /tmp}
    - {name: data, mountPath: /data}

service:
  name: mevzuat-takip
  type: ClusterIP
  labels:
    app: mevzuat-takip
  ports:
    - name: http-api
      port: 8000
      targetPort: http-api

# core-worker: başlangıçta tüm kuyruklar tek worker'da
worker:
  name: mevzuat-takip-worker
  replicaCount: 1
  queues: "ingest,process,ai,monitor,default"
  concurrency: 4
  resources:
    requests: {cpu: 500m, memory: 1Gi, ephemeral-storage: "2Gi"}
    limits: {cpu: "2", memory: 3Gi, ephemeral-storage: "4Gi"}     # büyük PDF'ler (≤50 MB)

# Yük artınca (ör. KEP, YZ yığılması) kuyruk bazında ayrı worker; o kuyruk worker.queues'tan çıkarılır. Örnek:
#   extraWorkers:
#     - {name: mevzuat-takip-worker-ai, replicaCount: 1, queues: "ai", concurrency: 2, resources: {...}}
extraWorkers: []

# core-beat: TEK örnek
beat:
  name: mevzuat-takip-beat
  resources:
    requests: {cpu: 50m, memory: 192Mi}
    limits: {cpu: 250m, memory: 384Mi}

ingress:
  enabled: true
  className: nginx
  host: mevzuat-takip.artinttest.albarakaturk.local
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "20m"        # manuel tespit Excel yüklemesi
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
  tls: []

# → ConfigMap (envVarsCM). Gizli olmayan ayarlar; açıklamalar backend/.env.example'da.
config:
  APP_ENV: prod
  TZ: Europe/Istanbul
  LOG_LEVEL: INFO
  DB_AUTO_CREATE: "false"
  # DMZ crawler MongoDB'ye yazar; ana servis Mongo → PostgreSQL aktarır, ham içeriği GridFS'ten okur
  CRAWL_MODE: remote
  RAW_STORAGE: gridfs
  MONGO_DB: mevzuat_crawl
  CRAWLER_STALE_MINUTES: "30"
  CELERY_VISIBILITY_TIMEOUT_S: "14400"
  CELERY_TASK_TIME_LIMIT_S: "10800"
  # vLLM (kurum GPU sunucusu, OpenAI uyumlu)
  LLM_PROVIDER: vllm
  LLM_BASE_URL: http://10.144.100.204:8806/v1
  LLM_MODEL: Qwen/Qwen3.6-35B-A3B-FP8
  LLM_MAX_CONCURRENCY: "2"
  # Azure Document Intelligence Read (kurum OCR)
  OCR_PROVIDER: azure_di
  AUTH_MODE: keycloak
  KEYCLOAK_ISSUER: https://keycloak.alb.albarakatech.com/realms/narui
