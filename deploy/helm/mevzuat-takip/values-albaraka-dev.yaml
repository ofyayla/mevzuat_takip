# DEV (namespace: dev). helm upgrade --install mevzuat-takip-dev deploy/helm/mevzuat-takip -n dev \
#   -f deploy/helm/mevzuat-takip/values-albaraka-dev.yaml
deployment:
  name: mevzuat-takip-dev
  replicaCount: 1
  labels: {app: mevzuat-takip-dev}
  podLabels: {framework: "python", app: "mevzuat-takip-dev"}
  image:
    tag: "dev"
  envVarsCM: mevzuat-takip-dev-config
  envVarsSecret: mevzuat-takip-dev-secrets

service:
  name: mevzuat-takip-dev
  labels: {app: mevzuat-takip-dev}

worker:
  name: mevzuat-takip-dev-worker
  concurrency: 2

beat:
  name: mevzuat-takip-dev-beat

ingress:
  host: mevzuat-takip-dev.artinttest.albarakaturk.local

config:
  APP_ENV: dev
  LOG_LEVEL: DEBUG
  # Cluster Redis'i diğer uygulamalarla paylaşılır: Celery anahtarları çakışmasın diye ayrı veritabanı numarası
  # (TEYİT: platform ekibinden boş DB numarası alınmalı)
  REDIS_URL: redis://redis-master.artint.svc:6379/6
  MONGO_DB: mevzuat_crawl_dev
  OCR_ENDPOINT: https://docintel.kurum.local            # TEYİT: kurum Azure DI adresi
  KEYCLOAK_CLIENT_ID: mevzuat-portal                    # TEYİT: IAM ekibi
  CORS_ORIGINS: https://mevzuat-takip-dev.artinttest.albarakaturk.local
