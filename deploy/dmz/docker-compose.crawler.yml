# DMZ crawler — podman-compose / docker compose ile alternatif kurulum (Quadlet tercih edilir):
#   podman-compose -f docker-compose.crawler.yml up -d
services:
  crawler:
    image: 10.54.62.31:9099/com.albaraka.ai/mevzuat-takip-crawler:latest
    env_file: [/etc/mevzuat/crawler.env]
    volumes: [crawlerdata:/data]
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    stop_grace_period: 2m
    restart: always
volumes: {crawlerdata: {}}
