# Gizli olmayan ayarlar. Gizli olanlar (DATABASE_URL, MONGO_URL, LLM_API_KEY, OCR_API_KEY) → secret.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: mevzuat-config
data:
  APP_ENV: prod
  TZ: Europe/Istanbul
  LOG_LEVEL: INFO
  DB_AUTO_CREATE: "false"
  # DMZ crawler MongoDB'ye yazar; ana servis Mongo → PostgreSQL aktarır, ham içeriği GridFS'ten okur
  CRAWL_MODE: remote
  RAW_STORAGE: gridfs
  MONGO_DB: mevzuat_crawl
  CRAWLER_STALE_MINUTES: "30"
  # Cluster içindeki Redis (yalnızca Celery tetikleyicisi; kalıcılık gerekmez)
  REDIS_URL: redis://redis.redis.svc.cluster.local:6379/0
  CELERY_VISIBILITY_TIMEOUT_S: "14400"
  CELERY_TASK_TIME_LIMIT_S: "10800"
  # LLM (vLLM) ve OCR (Azure Document Intelligence Read) — LAN içi uç noktalar
  LLM_PROVIDER: vllm
  LLM_BASE_URL: http://10.144.100.204:8806/v1
  LLM_MODEL: Qwen/Qwen3.6-35B-A3B-FP8
  LLM_MAX_CONCURRENCY: "2"
  OCR_PROVIDER: azure_di
  OCR_ENDPOINT: https://docintel.kurum.local
  # Portal / kimlik
  AUTH_MODE: keycloak
  KEYCLOAK_ISSUER: https://keycloak.kurum.local/realms/albaraka
  KEYCLOAK_CLIENT_ID: mevzuat-portal
  CORS_ORIGINS: https://mevzuat.kurum.local
