# Mevzuat Takip — LAN ana servis (Kubernetes). Uygulama:
#   1) secret.example.yaml → secret.yaml (değerleri doldurun; repoya eklenmez) ve: kubectl apply -f secret.yaml
#   2) kubectl apply -k deploy/k8s
# Şema güncellemesi: migrate Job'ı her sürümde yeniden çalıştırılır (bkz. docs/runbook.md §7).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: mevzuat
resources:
  - namespace.yaml
  - configmap.yaml
  - migrate-job.yaml
  - api.yaml
  - worker.yaml
  - beat.yaml
  - ingress.yaml
images:
  - name: mevzuat-core
    newName: registry.kurum.local/mevzuat/mevzuat-core   # kurum registry'si
    newTag: "0.2.0"
labels:
  - pairs: {app.kubernetes.io/part-of: mevzuat-takip}
