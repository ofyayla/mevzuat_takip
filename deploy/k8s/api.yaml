# core-api: portal (GUI) + /api/v1 (tarayıcı ve Albatros). Durumsuz; yatay ölçeklenir.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: core-api
spec:
  replicas: 2
  selector:
    matchLabels: {app.kubernetes.io/name: core-api}
  template:
    metadata:
      labels: {app.kubernetes.io/name: core-api}
    spec:
      securityContext: {runAsNonRoot: true, runAsUser: 10001, fsGroup: 10001}
      containers:
        - name: api
          image: mevzuat-core
          command: ["uvicorn", "app.api.main:app", "--host", "0.0.0.0", "--port", "8000",
                    "--proxy-headers", "--forwarded-allow-ips", "*"]
          ports: [{name: http, containerPort: 8000}]
          envFrom:
            - configMapRef: {name: mevzuat-config}
            - secretRef: {name: mevzuat-secrets}
          readinessProbe:
            httpGet: {path: /readyz, port: http}
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 30
            timeoutSeconds: 5
          resources:
            requests: {cpu: 250m, memory: 512Mi}
            limits: {cpu: "1", memory: 1Gi}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true}
          volumeMounts: [{name: tmp, mountPath: /tmp}, {name: data, mountPath: /data}]
      volumes: [{name: tmp, emptyDir: {}}, {name: data, emptyDir: {}}]
---
apiVersion: v1
kind: Service
metadata:
  name: core-api
spec:
  selector: {app.kubernetes.io/name: core-api}
  ports: [{name: http, port: 80, targetPort: http}]
