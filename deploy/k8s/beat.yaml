# core-beat: Celery zamanlayıcısı. MUTLAKA tek örnek: iki beat aynı görevi iki kez tetikler.
# Recreate: güncellemede eski pod kapanmadan yenisi açılmaz.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: core-beat
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app.kubernetes.io/name: core-beat}
  template:
    metadata:
      labels: {app.kubernetes.io/name: core-beat}
    spec:
      securityContext: {runAsNonRoot: true, runAsUser: 10001}
      containers:
        - name: beat
          image: mevzuat-core
          command: ["celery", "-A", "app.worker", "beat", "--schedule", "/tmp/celerybeat-schedule"]
          envFrom:
            - configMapRef: {name: mevzuat-config}
            - secretRef: {name: mevzuat-secrets}
          resources:
            requests: {cpu: 50m, memory: 192Mi}
            limits: {cpu: 250m, memory: 384Mi}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true}
          volumeMounts: [{name: tmp, mountPath: /tmp}]
      volumes: [{name: tmp, emptyDir: {}}]
