# Kopyalayın: secret.yaml (repoya EKLENMEZ) → kubectl -n mevzuat apply -f secret.yaml
# Kurumda Vault / External Secrets kullanılıyorsa aynı anahtarlarla oradan üretin.
apiVersion: v1
kind: Secret
metadata:
  name: mevzuat-secrets
  namespace: mevzuat
type: Opaque
stringData:
  DATABASE_URL: postgresql+psycopg://mevzuat:DEGISTIR@postgres.kurum.local:5432/mevzuat
  # Ana servis kullanıcısı (deploy/mongo/init-users.js → mevzuat_core): okuma + senkron işareti + tarama talebi
  MONGO_URL: mongodb://mevzuat_core:DEGISTIR@10.155.7.195:27017/?authSource=admin
  LLM_API_KEY: EMPTY
  OCR_API_KEY: ""
